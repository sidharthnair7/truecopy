services:
  - type: web
    name: truecopy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: ALLOW_LIVE_RUNS
        value: "false"
      - key: FRONTEND_URL
        value: /workspace
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_SECRET_JSON
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
