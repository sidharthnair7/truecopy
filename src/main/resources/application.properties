spring.application.name=truecopy
spring.config.import=optional:file:./.env[.properties]
server.port=8080
spring.threads.virtual.enabled=true
spring.jackson.serialization.indent-output=true

truecopy.frontend-url=
truecopy.cors-origins=http://localhost:5173,http://localhost:3000
truecopy.runs-dir=./runs
truecopy.source-language=en
truecopy.languages=es,fr,ja
truecopy.quota-budget=10000

truecopy.google.client-secrets-path=./client_secret.json
truecopy.google.tokens-dir=./tokens
truecopy.google.redirect-uri=http://localhost:8080/api/auth/callback
truecopy.google.application-name=TrueCopy

truecopy.llm.provider=gemini

truecopy.gemini.api-key=${GEMINI_API_KEY:}
truecopy.gemini.models=gemini-3.7-flash,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-3.8-flash
truecopy.gemini.base-url=https://generativelanguage.googleapis.com
truecopy.gemini.requests-per-minute=4

truecopy.anthropic.model=claude-opus-5
truecopy.anthropic.api-key=${ANTHROPIC_API_KEY:}
