name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  backend:
    name: Gate and extractor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B -q package
      - name: Test summary
        if: always()
        run: |
          for f in target/surefire-reports/TEST-*.xml; do
            python3 - "$f" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          print(f"{r.get('name').split('.')[-1]}: {r.get('tests')} tests, {r.get('failures')} failures, {r.get('errors')} errors")
          EOF
          done
